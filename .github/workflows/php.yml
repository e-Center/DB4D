name: PHP protocol and compatibility tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo
          coverage: none
      - run: composer validate --no-check-publish
      - run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/run.php
# The peer binds only to 127.0.0.1; no database, credentials, deployment or public service.
